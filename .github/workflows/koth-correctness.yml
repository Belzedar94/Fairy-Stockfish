name: KOTH Correctness

on:
  push:
    branches:
      - feature/koth-search-t0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koth-correctness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x86-64-sse2:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      KOTH_NET_URL: ${{ secrets.KOTH_LEGACY_NNUE_URL }}
      KOTH_NET_PATH: ${{ github.workspace }}\ci-input\kingofthehill-978b86d0e6a4.nnue
      KOTH_NET_SHA256: 978B86D0E6A45E05F9F1375DCED129CEA0ACEA13041EA65960691632EDC47AF7
      KOTH_ENGINE_SOURCE_COMMIT: 43e92e6de02cbd25779d0cea8bd2a7d0a05ace96
      KOTH_ENGINE_SOURCE_TREE: aa6b9c01b1113da0bfe260376ab894650fe09b00
      KOTH_ENGINE_SOURCE_DATE_EPOCH: 1788187875
      KOTH_ENGINE_BYTES: 4110970
      KOTH_ENGINE_SHA256: 2BEC2A11FE253957F6FFD0F2E120A2E7500A9D112975139ECF7736368A6D95B5
      KOTH_GCC_PACKAGE: mingw-w64-x86_64-gcc 16.1.0-5
      KOTH_GXX_SHA256: C2CA27DE1A97C077CAAD452318711D5DC95F43CC5E30FA81DD52C4BDD9DB3ABB
      KOTH_MAKE_PACKAGE: make 4.4.1-2
      KOTH_MAKE_SHA256: 2D3B9FCA575BE8E93C10AB74348055FA127A65CF628D52E9218AC76065CC6D22

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make

      - name: Authenticate compiler and make identities
        shell: msys2 {0}
        run: |
          test "$(pacman -Q mingw-w64-x86_64-gcc)" = "$KOTH_GCC_PACKAGE"
          test "$(sha256sum /mingw64/bin/g++.exe | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')" = "$KOTH_GXX_SHA256"
          test "$(pacman -Q make)" = "$KOTH_MAKE_PACKAGE"
          test "$(sha256sum /usr/bin/make.exe | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')" = "$KOTH_MAKE_SHA256"

      - name: Authenticate external legacy network input
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KOTH_NET_URL)) {
            throw "KOTH_LEGACY_NNUE_URL is not configured"
          }
          New-Item -ItemType Directory -Path (Split-Path $env:KOTH_NET_PATH) | Out-Null
          curl.exe --fail --location --silent --show-error `
            --output $env:KOTH_NET_PATH $env:KOTH_NET_URL
          $file = Get-Item -LiteralPath $env:KOTH_NET_PATH
          if ($file.Length -ne 47721371) {
            throw "legacy network byte count mismatch"
          }
          $observed = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
          if ($observed -ne $env:KOTH_NET_SHA256) {
            throw "legacy network SHA-256 mismatch"
          }

      - name: Install pinned referee dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r tools/koth-referee-requirements.txt

      - name: Build clean x86-64 SSE2 engine
        shell: msys2 {0}
        working-directory: src
        run: |
          export SOURCE_DATE_EPOCH="$KOTH_ENGINE_SOURCE_DATE_EPOCH"
          export TZ=UTC
          export LC_ALL=C
          make -j1 build ARCH=x86-64 COMP=mingw
          test "$(stat -c '%s' stockfish.exe)" = "$KOTH_ENGINE_BYTES"
          test "$(sha256sum stockfish.exe | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')" = "$KOTH_ENGINE_SHA256"

      - name: Run rule, referee, evaluator, and search contracts
        shell: pwsh
        run: |
          python tests/koth/test_rule_core.py src/stockfish.exe $env:KOTH_NET_PATH
          python tests/koth/test_referee.py src/stockfish.exe $env:KOTH_NET_PATH
          python tests/koth/test_legacy_nnue.py src/stockfish.exe $env:KOTH_NET_PATH
          python tests/koth/test_search.py src/stockfish.exe $env:KOTH_NET_PATH
          python tests/koth/test_book.py `
            tests/koth/fixtures/koth-runner-canary-v1.epd
          python tests/koth/test_runner.py `
            tools/koth_runner.py src/stockfish.exe $env:KOTH_NET_PATH

      - name: Produce deterministic bench and network-free package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts | Out-Null
          python tools/koth_bench.py src/stockfish.exe $env:KOTH_NET_PATH --runs 3 `
            --output artifacts/koth-bench.json
          $authenticatedEngineTree = git rev-parse "$env:KOTH_ENGINE_SOURCE_COMMIT^{tree}"
          if ($authenticatedEngineTree -ne $env:KOTH_ENGINE_SOURCE_TREE) {
            throw "engine source tree identity mismatch"
          }
          git diff --quiet $env:KOTH_ENGINE_SOURCE_COMMIT HEAD -- src
          if ($LASTEXITCODE -ne 0) {
            throw "src changed after the authenticated engine source commit"
          }
          $packageCommit = git rev-parse HEAD
          $packageTree = git rev-parse 'HEAD^{tree}'
          $packageEpoch = git show -s --format=%ct HEAD
          python tools/package_koth.py `
            --engine src/stockfish.exe `
            --source-root . `
            --output artifacts/KOTH-Stockfish-windows-x86-64.zip `
            --engine-source-commit $env:KOTH_ENGINE_SOURCE_COMMIT `
            --engine-source-tree $env:KOTH_ENGINE_SOURCE_TREE `
            --package-source-commit $packageCommit `
            --package-source-tree $packageTree `
            --engine-source-date-epoch $env:KOTH_ENGINE_SOURCE_DATE_EPOCH `
            --package-source-date-epoch $packageEpoch
          python tests/koth/test_package.py `
            artifacts/KOTH-Stockfish-windows-x86-64.zip $env:KOTH_NET_PATH

      - name: Upload network-free evidence artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KOTH-Stockfish-windows-x86-64-sse2
          path: |
            artifacts/koth-bench.json
            artifacts/KOTH-Stockfish-windows-x86-64.zip
          if-no-files-found: error
          retention-days: 7
